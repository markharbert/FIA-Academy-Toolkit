<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FIA DMO Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ─── Design tokens ──────────────────────────────────────────────────── */
    /* Light (default) */
    :root {
      --brand:       #06092a;
      --accent:      #3f92cc;
      --accent-dim:  #ebf5fb;
      --gold:        #e8b500;
      --red:         #da0010;
      --green:       #16a34a;

      --bg:          #f5f7fa;
      --bg-card:     #ffffff;
      --bg-input:    #f8fafc;
      --text:        #06092a;
      --text-sub:    #64748b;
      --text-muted:  #94a3b8;
      --border:      #e2e8f0;
      --border-med:  #cbd5e1;

      --tab-bg:      #ffffff;
      --tab-border:  #e2e8f0;
      --tab-active:  #06092a;
      --tab-idle:    #94a3b8;

      --prog-track:  #e2e8f0;
      --prog-fill:   #3f92cc;
      --prog-done:   #16a34a;

      --card-run-b:  #3f92cc;
      --card-done-b: #86efac;

      --btn-start-bg: #06092a; --btn-start-fg: #fff;
      --btn-pause-bg: #f1f5f9; --btn-pause-fg: #475569; --btn-pause-b: #e2e8f0;
      --btn-resume-bg:#3f92cc; --btn-resume-fg:#fff;
      --btn-done-bg:  #16a34a; --btn-done-fg: #fff;
      --btn-edit-bg:  #f1f5f9; --btn-edit-fg: #64748b; --btn-edit-b: #e2e8f0;
      --btn-manu-bg:  transparent; --btn-manu-fg:#94a3b8; --btn-manu-b:#e2e8f0;
      --btn-primary-bg: #da0010; --btn-primary-fg: #fff;
      --btn-ghost-bg: transparent; --btn-ghost-fg:#64748b; --btn-ghost-b:#e2e8f0;

      --timer-run:   #3f92cc;
      --timer-done:  #16a34a;
      --timer-idle:  #94a3b8;
      --timer-pause: #64748b;

      --pts-bg:      #f1f5f9;
      --pts-text:    #475569;
      --pts-full-bg: #dcfce7;
      --pts-full-txt:#16a34a;

      --streak-bg:  rgba(255,255,255,.12);
      --streak-b:   rgba(255,255,255,.18);
    }

    /* Dark */
    body.dark {
      --bg:          hsl(230,50%,6%);
      --bg-card:     hsl(230,48%,9%);
      --bg-input:    hsl(230,48%,8%);
      --text:        #f1f5f9;
      --text-sub:    hsl(230,20%,60%);
      --text-muted:  hsl(230,20%,45%);
      --border:      hsl(230,30%,18%);
      --border-med:  hsl(230,30%,24%);

      --tab-bg:      hsl(230,48%,8%);
      --tab-border:  hsl(230,30%,16%);
      --tab-active:  #ffffff;
      --tab-idle:    hsl(230,20%,48%);

      --prog-track:  hsl(230,30%,16%);
      --prog-fill:   #3f92cc;
      --prog-done:   #4ade80;

      --card-run-b:  hsl(203,54%,35%);
      --card-done-b: hsl(140,40%,30%);

      --btn-start-bg: hsl(203,54%,38%); --btn-start-fg: #fff;
      --btn-pause-bg: hsl(230,45%,16%); --btn-pause-fg:hsl(230,30%,65%); --btn-pause-b:hsl(230,30%,22%);
      --btn-resume-bg:hsl(203,54%,36%); --btn-resume-fg:#fff;
      --btn-done-bg:  hsl(140,55%,28%); --btn-done-fg: #fff;
      --btn-edit-bg:  hsl(230,45%,16%); --btn-edit-fg: hsl(230,30%,58%); --btn-edit-b:hsl(230,30%,22%);
      --btn-manu-bg:  transparent;      --btn-manu-fg: hsl(230,20%,48%); --btn-manu-b:hsl(230,30%,22%);
      --btn-primary-bg:hsl(203,54%,38%);--btn-primary-fg:#fff;
      --btn-ghost-bg: transparent; --btn-ghost-fg:hsl(230,20%,55%); --btn-ghost-b:hsl(230,30%,22%);

      --timer-run:   #3f92cc;
      --timer-done:  #4ade80;
      --timer-idle:  hsl(230,20%,42%);
      --timer-pause: hsl(230,20%,60%);

      --pts-bg:      hsl(230,40%,14%);
      --pts-text:    hsl(230,30%,58%);
      --pts-full-bg: hsl(140,40%,14%);
      --pts-full-txt:#4ade80;

      --streak-bg:  rgba(255,255,255,.07);
      --streak-b:   rgba(255,255,255,.12);
    }

    /* ─── Base ────────────────────────────────────────────────────────────── */
    body {
      width: 400px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      transition: background .2s, color .2s;
    }

    /* ─── Loading ─────────────────────────────────────────────────────────── */
    #loading-screen {
      display: none; align-items: center; justify-content: center; min-height: 200px;
    }
    #loading-screen.active { display: flex; }
    .spinner {
      width: 28px; height: 28px; border-radius: 50%;
      border: 2.5px solid rgba(255,255,255,.15);
      border-top-color: var(--accent);
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Setup ───────────────────────────────────────────────────────────── */
    #setup-screen {
      display: none; flex-direction: column; gap: 16px; padding: 24px 20px;
    }
    #setup-screen.active { display: flex; }
    .setup-logo {
      width: 64px; height: 64px; border-radius: 50%; overflow: hidden; margin: 0 auto;
      box-shadow: 0 0 0 3px rgba(232,181,0,.3);
    }
    .setup-logo img { width: 100%; height: 100%; object-fit: cover; }
    .setup-title { font-size: 16px; font-weight: 700; text-align: center; color: var(--text); }
    .setup-desc { font-size: 12px; color: var(--text-sub); line-height: 1.6; text-align: center; }
    .setup-desc a { color: var(--accent); text-decoration: none; }

    /* ─── Shared form elements ────────────────────────────────────────────── */
    .field-label {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .07em; color: var(--text-muted); margin-bottom: 5px;
    }
    .text-input {
      width: 100%; padding: 9px 12px; border-radius: 8px;
      background: var(--bg-input); border: 1px solid var(--border-med);
      color: var(--text); font-size: 13px; outline: none; font-family: inherit;
      transition: border-color .15s;
    }
    .text-input:focus { border-color: var(--accent); }
    .text-input::placeholder { color: var(--text-muted); }
    .btn-primary {
      width: 100%; padding: 10px 16px; border-radius: 8px; border: none; cursor: pointer;
      background: var(--btn-primary-bg); color: var(--btn-primary-fg);
      font-size: 13px; font-weight: 600; font-family: inherit; transition: opacity .15s;
    }
    .btn-primary:hover { opacity: .88; }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
    .btn-ghost {
      width: 100%; padding: 9px 16px; border-radius: 8px; cursor: pointer; font-family: inherit;
      border: 1px solid var(--btn-ghost-b); background: var(--btn-ghost-bg);
      color: var(--btn-ghost-fg); font-size: 13px;
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--border-med); }
    .error-msg { font-size: 12px; color: var(--red); }

    /* ─── Main screen ─────────────────────────────────────────────────────── */
    #main-screen { display: none; flex-direction: column; }
    #main-screen.active { display: flex; }

    /* ── Header (always brand dark) ── */
    .header {
      background: var(--brand);
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 14px 10px;
    }
    .header-left { display: flex; align-items: center; gap: 9px; }
    .header-icon {
      width: 32px; height: 32px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
      box-shadow: 0 0 0 2px rgba(232,181,0,.4);
    }
    .header-icon img { width: 100%; height: 100%; display: block; }
    .header-title { font-size: 14px; font-weight: 700; color: #fff; }
    .header-sub   { font-size: 10px; color: rgba(255,255,255,.45); margin-top: 1px; }

    .header-right { display: flex; align-items: center; gap: 7px; }
    .streak-pill {
      display: flex; align-items: center; gap: 4px;
      background: var(--streak-bg); border: 1px solid var(--streak-b);
      border-radius: 20px; padding: 3px 9px;
      font-size: 11px; font-weight: 700; color: var(--gold);
    }
    .pts-pill {
      display: flex; align-items: center; gap: 2px;
      background: var(--streak-bg); border: 1px solid var(--streak-b);
      border-radius: 20px; padding: 3px 9px;
      font-size: 11px; font-weight: 600; color: rgba(255,255,255,.8);
    }
    .pts-pill .pts-denom { color: rgba(255,255,255,.4); }

    .theme-btn {
      background: none; border: none; cursor: pointer; padding: 5px;
      color: rgba(255,255,255,.5); border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      transition: color .15s, background .15s;
    }
    .theme-btn:hover { color: #fff; background: rgba(255,255,255,.08); }

    /* ── Tab bar ── */
    .tab-bar {
      display: flex; background: var(--tab-bg);
      border-bottom: 1px solid var(--tab-border);
    }
    .tab-btn {
      flex: 1; padding: 9px 0; font-size: 12px; font-weight: 500;
      color: var(--tab-idle); border: none; background: transparent; cursor: pointer;
      border-bottom: 2px solid transparent; font-family: inherit;
      transition: color .15s, border-color .15s;
    }
    .tab-btn.active { color: var(--tab-active); border-bottom-color: var(--accent); font-weight: 600; }
    .tab-btn:hover:not(.active) { color: var(--text-sub); }

    /* ── Tab panels ── */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ─── Points strip ────────────────────────────────────────────────────── */
    .pts-strip { height: 3px; background: var(--prog-track); overflow: hidden; }
    .pts-fill  {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #3f92cc88);
      transition: width .4s ease;
    }

    /* ─── Activity cards ──────────────────────────────────────────────────── */
    .activities { padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; }

    .act-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden;
      transition: border-color .15s;
    }
    .act-card.running { border-color: var(--card-run-b); }
    .act-card.done    { border-color: var(--card-done-b); }

    .card-top {
      display: flex; align-items: center; gap: 9px; padding: 9px 12px 5px;
    }
    .act-emoji { font-size: 19px; flex-shrink: 0; line-height: 1; }
    .act-info  { flex: 1; min-width: 0; }
    .act-name  { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .act-goal  { font-size: 10px; color: var(--text-muted); margin-top: 1px; }

    .pts-badge {
      font-size: 10px; font-weight: 700; padding: 2px 7px;
      border-radius: 12px; flex-shrink: 0;
      background: var(--pts-bg); color: var(--pts-text);
      transition: background .2s, color .2s;
    }
    .pts-badge.full { background: var(--pts-full-bg); color: var(--pts-full-txt); }

    .prog-track { height: 2.5px; margin: 0 12px; background: var(--prog-track); border-radius: 2px; }
    .prog-fill  { height: 100%; border-radius: 2px; background: var(--prog-fill); transition: width .3s ease; }
    .act-card.done .prog-fill { background: var(--prog-done); }

    .card-bottom {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 12px 9px; gap: 8px;
    }

    /* Timer displays */
    .timer { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .01em; min-width: 52px; }
    .timer.idle   { font-size: 11px; font-weight: 500; color: var(--timer-idle); }
    .timer.running{ color: var(--timer-run); }
    .timer.paused { color: var(--timer-pause); font-size: 18px; }
    .timer.done   { color: var(--timer-done); font-size: 14px; font-weight: 600; }

    /* Button row */
    .btn-row { display: flex; align-items: center; gap: 5px; }
    .cbtn {
      padding: 5px 11px; border-radius: 7px; border: none;
      font-size: 11px; font-weight: 600; cursor: pointer; font-family: inherit;
      transition: opacity .12s; white-space: nowrap;
    }
    .cbtn:hover  { opacity: .84; }
    .cbtn:active { opacity: .68; }
    .cbtn-start  { background: var(--btn-start-bg);  color: var(--btn-start-fg); }
    .cbtn-pause  { background: var(--btn-pause-bg);  color: var(--btn-pause-fg); border: 1px solid var(--btn-pause-b); }
    .cbtn-resume { background: var(--btn-resume-bg); color: var(--btn-resume-fg); }
    .cbtn-done   { background: var(--btn-done-bg);   color: var(--btn-done-fg); }
    .cbtn-edit   { background: var(--btn-edit-bg);   color: var(--btn-edit-fg); border: 1px solid var(--btn-edit-b); }
    .cbtn-manual { background: var(--btn-manu-bg);   color: var(--btn-manu-fg); border: 1px solid var(--btn-manu-b); }

    /* Manual entry row */
    .manual-row {
      display: none; align-items: center; gap: 6px;
      padding: 0 12px 9px; flex-wrap: nowrap;
    }
    .manual-row.open { display: flex; }
    .manual-row input {
      width: 72px; padding: 5px 8px; border-radius: 6px; text-align: center;
      background: var(--bg-input); border: 1px solid var(--border-med);
      color: var(--text); font-size: 13px; outline: none; font-family: inherit;
    }
    .manual-row input:focus { border-color: var(--accent); }
    .manual-row .m-unit { font-size: 11px; color: var(--text-muted); }
    .m-save   { padding: 5px 10px; border-radius: 6px; border: none; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; font-size: 11px; font-weight: 600; }
    .m-cancel { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 18px; line-height: 1; padding: 2px 4px; }

    /* ─── Notes ───────────────────────────────────────────────────────────── */
    .notes-wrap { padding: 2px 10px 8px; }
    .notes-label {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .07em; color: var(--text-muted); margin-bottom: 5px;
    }
    .notes-input {
      width: 100%; padding: 8px 10px; border-radius: 8px; resize: vertical;
      background: var(--bg-input); border: 1px solid var(--border);
      color: var(--text); font-size: 12px; outline: none; font-family: inherit;
      line-height: 1.55;
    }
    .notes-input:focus   { border-color: var(--accent); }
    .notes-input::placeholder { color: var(--text-muted); }

    /* ─── Footer ──────────────────────────────────────────────────────────── */
    .tracker-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px 10px; border-top: 1px solid var(--border);
    }
    .open-link { font-size: 11px; color: var(--accent); text-decoration: none; font-weight: 500; }
    .open-link:hover { text-decoration: underline; }
    .save-status { font-size: 11px; color: var(--text-muted); }

    /* ─── Log tab ─────────────────────────────────────────────────────────── */
    .log-list  { padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
    .log-empty { padding: 28px 16px; text-align: center; font-size: 12px; color: var(--text-muted); }
    .log-loading { padding: 28px 16px; display: flex; align-items: center; justify-content: center; }
    .log-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-radius: 9px;
      background: var(--bg-card); border: 1px solid var(--border);
    }
    .log-date  { font-size: 11px; font-weight: 600; color: var(--text-sub); min-width: 68px; }
    .log-dots  { display: flex; gap: 3px; flex: 1; }
    .log-dot   { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .log-dot.off { background: var(--prog-track); }
    .log-pts   { font-size: 11px; font-weight: 700; color: var(--text-sub); min-width: 28px; text-align: right; }
    .log-time  { font-size: 10px; color: var(--text-muted); min-width: 44px; text-align: right; }

    /* ─── Settings tab ────────────────────────────────────────────────────── */
    .settings-panel { padding: 14px 14px; display: flex; flex-direction: column; gap: 12px; }
    .settings-section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); }
    .settings-block { display: flex; flex-direction: column; gap: 6px; }
    .target-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 10px; border-radius: 8px;
      background: var(--bg-card); border: 1px solid var(--border);
    }
    .target-act { font-size: 12px; color: var(--text); }
    .target-right { display: flex; align-items: center; gap: 4px; }
    .target-input {
      width: 56px; padding: 4px 8px; border-radius: 6px; text-align: center;
      background: var(--bg-input); border: 1px solid var(--border-med);
      color: var(--text); font-size: 12px; outline: none; font-family: inherit;
    }
    .target-input:focus { border-color: var(--accent); }
    .target-unit { font-size: 10px; color: var(--text-muted); }
    .btn-save-goals {
      align-self: flex-start; padding: 7px 14px; border-radius: 8px; border: none; cursor: pointer;
      background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; font-family: inherit;
    }
    .btn-save-goals:hover { opacity: .88; }
    .settings-divider { border: none; border-top: 1px solid var(--border); margin: 0; }
  </style>
</head>
<body>

<!-- Loading -->
<div id="loading-screen"><div class="spinner"></div></div>

<!-- Setup -->
<div id="setup-screen">
  <div class="setup-logo"><img src="icons/icon128.png" alt="FIA" /></div>
  <div class="setup-title">FIA Toolkit — DMO Tracker</div>
  <p class="setup-desc">
    Enter your API key to track your Daily Method of Operation from any page.<br/>
    Get one at <a href="https://toolkit.fearlessmarketinglab.com/account" target="_blank">toolkit.fearlessmarketinglab.com</a> → Account → API Access.
  </p>
  <div>
    <div class="field-label">API Key</div>
    <input type="password" id="api-key-input" class="text-input" placeholder="ftk_…" autocomplete="off" />
  </div>
  <div id="setup-error" class="error-msg" style="display:none"></div>
  <button id="save-key-btn" class="btn-primary">Connect</button>
</div>

<!-- Main -->
<div id="main-screen">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="header-icon"><img src="icons/icon128.png" alt="FIA" /></div>
      <div>
        <div class="header-title">DMO Tracker</div>
        <div class="header-sub" id="date-sub">Today</div>
      </div>
    </div>
    <div class="header-right">
      <div class="streak-pill">🔥 <span id="streak-count">0</span></div>
      <div class="pts-pill"><span id="total-pts">0.0</span><span class="pts-denom">/25 pts</span></div>
      <button class="theme-btn" id="theme-btn" title="Toggle light/dark">
        <!-- icon injected by JS -->
      </button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="log">Log</button>
    <button class="tab-btn" data-tab="settings">Settings</button>
  </div>

  <!-- Today -->
  <div id="tab-today" class="tab-panel active">
    <div class="pts-strip"><div class="pts-fill" id="pts-bar" style="width:0%"></div></div>
    <div id="activities" class="activities"></div>
    <div class="notes-wrap">
      <div class="notes-label">Notes</div>
      <textarea id="notes-field" class="notes-input" placeholder="Add notes for today…" rows="3"></textarea>
    </div>
    <div class="tracker-footer">
      <a href="https://toolkit.fearlessmarketinglab.com/dmo-tracker" target="_blank" class="open-link">Open full tracker →</a>
      <span class="save-status" id="save-status"></span>
    </div>
  </div>

  <!-- Log -->
  <div id="tab-log" class="tab-panel">
    <div id="log-content"></div>
  </div>

  <!-- Settings -->
  <div id="tab-settings" class="tab-panel">
    <div class="settings-panel">
      <div class="settings-section-title">Daily Goals</div>
      <div class="settings-block" id="target-rows"></div>
      <button class="btn-save-goals" id="save-targets-btn">Save Goals</button>
      <hr class="settings-divider" />
      <div class="settings-section-title">API Key</div>
      <div class="settings-block">
        <input type="password" id="settings-key-input" class="text-input" placeholder="ftk_…" />
        <div id="settings-error" class="error-msg" style="display:none"></div>
        <button id="update-key-btn" class="btn-primary">Update Key</button>
        <button id="disconnect-btn" class="btn-ghost">Disconnect &amp; clear all data</button>
      </div>
    </div>
  </div>

</div><!-- /main-screen -->

<script src="popup.js"></script>
</body>
</html>
